[package]
name        = "kaas-producer-canary"
description = "Writes a timestamped Avro heartbeat to a Kafka topic once a second, using kaas-lib."
version     = "0.6.0"
edition     = "2024"
license     = "Apache-2.0"
publish     = false

[dependencies]
# The library under test. This is the point of the canary: it exercises
# kaas-lib's write path continuously against a real cluster, which is the one
# thing neither the container acceptance suite nor a one-shot live run can do
# — they both stop after a few seconds, and the failures worth catching here
# are the ones that need hours (a leader election, a re-authentication window,
# a slow connection leak).
kafka-produce = "0.7"
kafka-admin   = "0.7"
# Direct rather than through kafka-admin, which re-exports only the error types.
# TLS, SASL and the `TokenProvider` trait are kafka-conn's, and OAUTHBEARER
# needs all three. Not a new dependency in any real sense: the same
# lockstep-released library, already in the tree underneath the two above.
#
# Deliberately WITHOUT the `oidc` feature. That feature is a
# `client_credentials` exchange with a client secret, which is not the flow this
# canary uses — and kaas-lib is a Kafka client library, so the federated
# exchange that replaces it belongs here rather than there. `token.rs` implements
# it against the generic `TokenProvider` trait, which is the seam kaas-lib
# offers for exactly this.
kafka-conn    = "0.7"

# The token exchange in `token.rs`, and nothing else. Pinned to match kaas-lib's
# own workspace pins exactly, which is the whole reason this is safe to add:
# `hyper-rustls` with `default-features = false, features = ["ring"]` brings no
# second crypto provider, so `default_provider()` still resolves to ring for the
# Kafka connection this canary exists to watch, and nothing here needs cmake or
# a C toolchain. The image stays a static musl build whose only build package is
# `musl-dev`.
#
# The alternative was `azure_identity`, which does exactly this exchange and is
# maintained by people who own the protocol. It is not usable here: it resolves
# to 194 additional packages including `aws-lc-rs` and `aws-lc-sys`, which is
# both the C toolchain this image refuses and the second provider the Avro block
# below refuses. In a Go or Python canary it would be the right answer.
hyper           = { version = "1.8", features = ["client", "http1"] }
hyper-util      = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls    = { version = "0.27", default-features = false, features = [
    "http1",
    "ring",
    "tls12",
    "logging",
] }
http-body-util  = "0.1"
form_urlencoded = "1.2"
bytes           = "1.12"
# `ring` is named explicitly when the client config is built rather than left to
# `rustls`'s process-wide default provider. Same reasoning as kaas-lib's own
# TlsConfig: a default provider is global mutable state that any dependency can
# install first, and "whichever crate initialised earliest wins" is not a
# property to hang a TLS handshake on.
rustls              = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-native-certs = "0.8"

# Avro, and the Confluent wire format around it.
#
# No TLS feature, which is a deliberate exclusion rather than an oversight.
# Both of the crate's options reach for a C project: `native_tls` wants
# OpenSSL, and `rustls_tls` resolves to `reqwest/rustls`, which pins
# `rustls/aws-lc-rs` and so pulls `aws-lc-sys` and cmake. Either one costs this
# repository the property its Dockerfile is built on — a static musl image
# whose only build package is `musl-dev`. Worse, `aws-lc-rs` would also arrive
# in the same `rustls` that kaas-lib uses with `ring`, which changes what
# `default_provider()` resolves to for the Kafka connection this canary exists
# to watch. That is not a change to make as a side effect of adding Avro.
#
# TLS to the registry comes from `reqwest` below instead.
#
# `futures` is what gates `async_impl`; without it only the blocking encoder
# exists, and a blocking HTTP call inside a tokio worker is not an option here.
#
# `apache-avro` is a direct dependency because the schema is written here, and
# its version must track whatever `schema_registry_converter` resolves — the
# `Schema` handed to `get_supplied_schema` is that crate's type, not ours.
schema_registry_converter = { version = "4.10", default-features = false, features = ["avro", "futures"] }
apache-avro = "0.21"
# The registry client's TLS, on the one copy of reqwest the converter already
# brings. `rustls-no-provider` adds rustls with no crypto provider of its own,
# so no aws-lc. It also leaves reqwest with nothing to fall back on: building
# a client panics unless a process-wide default is installed. This crate
# installs none, for the reason above `rustls`, and hands reqwest a finished
# `ClientConfig` naming `ring` instead (`registry.rs`).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

tokio  = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time"] }
clap   = { version = "4.5", features = ["derive", "env"] }
serde  = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.clippy]
# Same rule 2 as kaas-lib, and for a sharper reason: this process is meant to
# run for weeks. A panic in a heartbeat loop is a canary that stops singing,
# which reads as "the cluster is down" and is not.
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"

[lints.rust]
unsafe_code = "forbid"

